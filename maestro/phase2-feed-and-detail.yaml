appId: com.reddyscb.lore
---
# Assumes seed data exists: a place named "The Copper Pot" with at least
# one drop. Assumes a signed-in session already exists in the simulator.
#
# Note: tab bar items and place-card headers expose composite
# accessibility labels (e.g. "The Copper Pot, Gachibowli, Open, ..."), so
# selectors below use .*wildcards.* rather than exact text — Maestro's
# text matcher is anchored, not substring.
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Home"
    timeout: 15000
- tapOn: ".*Home.*"
- assertVisible: "Home"
- assertVisible: "MUST ORDER"
- tapOn: ".*The Copper Pot.*"
- extendedWaitUntil:
    visible: ".*Gachibowli.*"
    timeout: 10000
- assertVisible: "Drop lore about this place"
- assertVisible: "Drops"
- tapOn: "Back"
- extendedWaitUntil:
    visible: "Home"
    timeout: 8000

appId: com.reddyscb.lore
---
# Assumes seed data: a place named "The Copper Pot" with at least one
# drop. Assumes a signed-in session already exists in the simulator.
#
# Note: tab bar items and place-card headers expose composite
# accessibility labels, so selectors below use .*wildcards.* rather than
# exact text — Maestro's text matcher is anchored, not substring.
#
# Note: each run inserts a new reply into the live dev Supabase project.
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Home"
    timeout: 15000
- tapOn: ".*Home.*"
- tapOn: ".*The Copper Pot.*"
- scroll
- tapOn: "Reply…"
- inputText: "Maestro regression reply"
- tapOn: "Post"
- assertVisible: ".*Maestro regression reply.*"

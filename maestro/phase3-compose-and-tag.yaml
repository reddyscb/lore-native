appId: com.reddyscb.lore
---
# Assumes seed data: a place named "The Copper Pot" and a profile named
# "sree" (for tagging). Assumes a signed-in session already exists in the
# simulator. This is the highest-value regression flow — it covers the
# create-drop -> tag-friend write path, which depends on RLS WITH CHECK
# policies actually being satisfied by the client (see CLAUDE.md).
#
# Note: tab bar items and place-card headers expose composite
# accessibility labels, so selectors below use .*wildcards.* rather than
# exact text — Maestro's text matcher is anchored, not substring.
#
# Note: each run inserts a new drop into the live dev Supabase project —
# there's no separate test project to reset between runs.
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Home"
    timeout: 15000
- tapOn: ".*Drop lore.*"
- tapOn: "Search cafés by name"
- inputText: "Copper"
- extendedWaitUntil:
    visible: ".*The Copper Pot.*"
    timeout: 8000
- tapOn: ".*The Copper Pot.*"
- assertVisible: "Change"

- tapOn: "The one dish you'd send a friend for"
- inputText: "Maestro regression dish"

- scroll
- tapOn: "Search by name"
- inputText: "sree"
- tapOn:
    text: "sree"
    index: 0

- tapOn: "Post drop"
- assertVisible: ".*Maestro regression dish.*"

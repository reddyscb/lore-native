appId: com.reddyscb.lore
---
# Covers the owner dashboard write path: claim an unclaimed place -> land
# on the owner dashboard -> update its status -> add a dish -> remove it.
#
# Assumes seed data: an unclaimed place named "Maestro Claim Test Café" (no owner_id),
# reserved for this flow only. Assumes a signed-in session already exists
# in the simulator.
#
# Note: tab bar items expose composite accessibility labels, so selectors
# below use .*wildcards.* rather than exact text — Maestro's text matcher
# is anchored, not substring.
#
# Important: there is no "unclaim" feature (by design — see
# docs/superpowers/specs/2026-08-06-owner-dashboard-design.md), so this
# flow is only re-runnable from a clean state. Before re-running, reset
# both sides of the claim:
#   update places set owner_id = null, status = 'open', reopen_date = null
#     where id = '80a63bec-6542-41bc-b96c-acdb6ad524c3';
#   update profiles set role = 'seeker' where id = '<test account's id>';
# Without that reset, the Profile button will already read "Owner
# dashboard" instead of "Claim a place" and this flow's early steps won't
# find what they're looking for.
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Home"
    timeout: 15000
- extendedWaitUntil:
    visible: ".*Profile.*"
    timeout: 8000
- tapOn: ".*Profile.*"
- extendedWaitUntil:
    visible: ".*Claim a place.*"
    timeout: 10000
- tapOn: ".*Claim a place.*"
- extendedWaitUntil:
    visible: "Find your café"
    timeout: 10000
- tapOn: ".*Maestro Claim Test Café.*"
- extendedWaitUntil:
    visible: "Managing your places"
    timeout: 10000
- assertVisible: "Maestro Claim Test Café"
- tapOn:
    text: "Manage"
    below: ".*Maestro Claim Test Café.*"
- extendedWaitUntil:
    visible: "Maestro Claim Test Café"
    timeout: 10000
- tapOn: "Temporarily closed"
- tapOn: "Expected back (e.g. 25 Jul)"
- inputText: "Maestro test date"
# Single-line field (no `multiline` prop) — pressKey Enter blurs it via
# RN's default blurOnSubmit, same fix CLAUDE.md documents for single-line
# fields. No need for the "tap inert Text" workaround multiline fields need.
- pressKey: Enter
- tapOn: "Update status"
- extendedWaitUntil:
    visible: ".*Status updated.*"
    timeout: 8000
- scrollUntilVisible:
    element: "Add a dish…"
    direction: DOWN
    timeout: 8000
- tapOn: "Add a dish…"
- inputText: "Maestro regression dish"
# Enter already submits via the field's onSubmitEditing (RN's default
# blurOnSubmit, same single-line-field pattern used above for the
# reopen-date field) — a follow-up tapOn "Add" is not just redundant,
# it's unreliable: the new DishRow renders above the add-dish form,
# pushing the "Add" button below the last scroll position, so Maestro
# can't find it. Confirmed by running this flow against a real
# Simulator — the dish was already added before the tap failed.
- pressKey: Enter
- extendedWaitUntil:
    visible: ".*Maestro regression dish.*"
    timeout: 8000
- scrollUntilVisible:
    element: ".*Maestro regression dish.*"
    direction: DOWN
    timeout: 8000
- tapOn: "remove"
# The destructive confirm button lives in a native UIAlertController
# (Alert.alert), not the RN view tree. Confirmed by direct comparison on
# a real Simulator: `tapOn: "Remove"` (text match) never dismisses this
# specific alert — Maestro reports the tap COMPLETED but the dialog stays
# on screen — while a coordinate tap at the same button lands correctly.
# Tapping by point (centered in the button, as a % of screen so it's
# resolution-independent) is the reliable way to hit a native alert
# button here.
- tapOn:
    point: "68%,56%"
# deleteDish is a real network round-trip before local state updates and
# the native Alert dismiss animation completes — a bare assertNotVisible
# right after the tap ran ahead of both. extendedWaitUntil gives it room,
# same fix pattern this file already uses for the async status update
# above.
- extendedWaitUntil:
    notVisible: ".*Maestro regression dish.*"
    timeout: 8000
